<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width>, initial-scale=1.0"/>
     <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.31.0/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.5/moment-timezone-with-data-1970-2030.min.js"></script>
     <title>World o'Clocko</title>
</head>
<body>
    <div class="container">
        <h1>World Clock</h1>
        
        <select id="city">
                <option value="">Select a City</option>
                <option value="current">My current location</option>
            <option value="America/Los_Angeles"> Los Angeles</option>
            <option value="America/New_York"> New York</option>
            <option value=""> Paris</option>
            <option value="Asia/Shanghai"> Shanghai</option>
            <option value=""> Tokyo</option>
        </select>
       
            <div id="cities">
                <div class="city" id="los-angeles">
                    <div>
                    <h2>Los Angles</h2>
                    <div class="date"> </div>
                    </div>
                    <div class="time"> </div>
                    </div>
                    <div class="city" id="new-york">
                    <div>
                    <h2>New York</h2>
                    <div class="date"></div>
                    </div>
                    <div class="time"></div>
                </div>
            </div>
         </div>
            
    <script src="javascript/index.js"></script>
    <footer> This project was coded by <Strong>Abigail Greene</Strong> and open sourced on <a href="https://github.com/Bone-Structure/World-o-Clocko" target="_blank">Github.</a> </footer>
</body>
</html>
